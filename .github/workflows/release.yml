name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(jq -r .version manifest.json)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag $tag does not match manifest version $ver" >&2
            exit 1
          fi

      - name: Build zip
        run: |
          zip -r "universal-dark-${GITHUB_REF_NAME}.zip" manifest.json background.js content popup icons README.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "universal-dark-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes
